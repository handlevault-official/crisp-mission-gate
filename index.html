<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crisp Suite — 3D Mission Gate</title>
    <style>
        :root {
            --bg-color: #0f1117;
            --card-bg: #161a29;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #f2c879;
            --border: rgba(242, 200, 121, 0.3);
            --env-flap: #1f253d;
        }

        body.light-theme {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent: #d97706;
            --border: rgba(217, 119, 6, 0.3);
            --env-flap: #e2e8f0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            perspective: 1000px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .scene {
            width: 100%;
            max-width: 620px;
            perspective: 1200px;
        }

        .gate-container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 35px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.3s, border-color 0.3s;
        }

        .gate-container:hover {
            transform: translateY(-5px) rotateX(2deg) rotateY(-2deg);
        }

        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .brand-badge {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .controls-group {
            display: flex;
            gap: 8px;
        }

        button {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        button:hover {
            background: var(--accent);
            color: #0f1117;
        }

        /* 3D Mission Stamp / Badge UI */
        .mission-stamp {
            display: inline-block;
            background: rgba(242, 200, 121, 0.1);
            border: 1px dashed var(--accent);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        h2 {
            margin-top: 0;
            color: var(--text-main);
            font-size: 1.75rem;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-muted);
            line-height: 1.7;
            font-size: 1rem;
            margin-bottom: 25px;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--accent);
            color: #0f1117;
            padding: 12px 24px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            box-shadow: 0 4px 14px rgba(242, 200, 121, 0.3);
            transition: transform 0.2s, opacity 0.2s;
        }

        .action-btn:hover {
            transform: scale(1.02);
            opacity: 0.95;
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="gate-container">
            <div class="header-controls">
                <span class="brand-badge">✦ Crisp Suite • Mission Gate</span>
                <div class="controls-group">
                    <button id="langToggle" onclick="toggleLanguage()">EN / TL</button>
                    <button id="themeToggle" onclick="toggleTheme()">☀️ / 🌙</button>
                </div>
            </div>

            <div id="content">
                <div class="mission-stamp" id="stampText">Classified Objective • Active</div>
                <h2 id="title">Mission Control &amp; Strategic Execution</h2>
                <p id="desc">Welcome to the 3D Mission Gate. Define your core tactical objectives, track critical project milestones, and execute deliverables with precision framework alignment.</p>
                <a href="#" class="action-btn" id="ctaBtn">Initialize Mission Portal ↗</a>
            </div>
        </div>
    </div>

    <!-- Core UI & 3D Dual-Language Logic Script -->
    <script>
        const translations = {
            en: {
                stamp: "Classified Objective • Active",
                title: "Mission Control & Strategic Execution",
                desc: "Welcome to the 3D Mission Gate. Define your core tactical objectives, track critical project milestones, and execute deliverables with precision framework alignment.",
                cta: "Initialize Mission Portal ↗"
            },
            tl: {
                stamp: "Kumpidensyal na Layunin • Aktibo",
                title: "Gabay sa Misyon at Estratehikong Aksyon",
                desc: "Maligayang pagdating sa 3D Mission Gate. Itakda ang iyong mga pangunahing layunin, subaybayan ang mga hakbang ng proyekto, at isagawa ang iyong mga mithiin gamit ang tamang sistema.",
                cta: "Buksan ang Mission Portal ↗"
            }
        };

        let currentLang = 'en';

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'tl' : 'en';
            document.getElementById('stampTextinnerText') || (document.getElementById('stampText').innerText = translations[currentLang].stamp);
            document.getElementById('title').innerText = translations[currentLang].title;
            document.getElementById('desc').innerText = translations[currentLang].desc;
            document.getElementById('ctaBtn').innerText = translations[currentLang].cta;
        }

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
        }
    </script>

    <!-- Repository / External Data Script -->
    <script src="repo.js"></script>

</body>
</html>
