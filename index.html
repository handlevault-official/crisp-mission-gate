<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crisp Suite — Mission Gate</title>
    <style>
        :root {
            --bg-color: #0f1117;
            --card-bg: #161a29;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #f2c879;
            --border: rgba(242, 200, 121, 0.3);
        }

        body.light-theme {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent: #d97706;
            --border: rgba(217, 119, 6, 0.3);
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .gate-container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .controls-group {
            display: flex;
            gap: 10px;
        }

        button {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        button:hover {
            background: var(--accent);
            color: #0f1117;
        }

        h2 {
            margin-top: 0;
            color: var(--accent);
        }

        p {
            color: var(--text-muted);
            line-height: 1.6;
        }

        .action-btn {
            display: inline-block;
            margin-top: 20px;
            background: var(--accent);
            color: #0f1117;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="gate-container">
        <div class="header-controls">
            <span style="font-weight: bold; color: var(--accent);">Crisp Suite • Mission Gate</span>
            <div class="controls-group">
                <button id="langToggle" onclick="toggleLanguage()">EN / TL</button>
                <button id="themeToggle" onclick="toggleTheme()">☀️ / 🌙</button>
            </div>
        </div>

        <div id="content">
            <h2 id="title">Mission Control & Objectives</h2>
            <p id="desc">Welcome to the Mission Gate. Define your core objectives, track your strategic milestones, and execute your digital goals with precise framework alignment.</p>
            <a href="#" class="action-btn" id="ctaBtn">Enter Mission Portal ↗</a>
        </div>
    </div>

    <script>
        // Language Data
        const translations = {
            en: {
                title: "Mission Control & Objectives",
                desc: "Welcome to the Mission Gate. Define your core objectives, track your strategic milestones, and execute your digital goals with precise framework alignment.",
                cta: "Enter Mission Portal ↗"
            },
            tl: {
                title: "Gabay sa Misyon at mga Layunin",
                desc: "Maligayang pagdating sa Mission Gate. Itakda ang iyong mga pangunahing layunin, subaybayan ang mga estratehikong hakbang, at tuparin ang iyong mga mithiin sa tamang sistema.",
                cta: "Buksan ang Mission Portal ↗"
            }
        };

        let currentLang = 'en';

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'tl' : 'en';
            document.getElementById('title').innerText = translations[currentLang].title;
            document.getElementById('desc').innerText = translations[currentLang].desc;
            document.getElementById('ctaBtn').innerText = translations[currentLang].cta;
        }

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
        }
    </script>

</body>
</html>
