<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Gate — Crisp Suite</title>
    
    <!-- PWA Manifest & Theme -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0b0f19">
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        header {
            margin-top: 40px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            color: #00d2ff;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 1rem;
        }

        main {
            background: rgba(18, 24, 36, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        }

        .badge {
            display: inline-block;
            background: rgba(0, 210, 255, 0.15);
            color: #00d2ff;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
        }

        .description {
            color: #cbd5e1;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn-access {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00d2ff, #0072ff);
            color: #fff;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 8px 20px rgba(0, 210, 255, 0.25);
            transition: opacity 0.2s, transform 0.2s;
        }

        .btn-access:hover {
            opacity: 0.95;
            transform: translateY(-2px);
        }

        footer {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mission Gate</h1>
        <p class="subtitle">Crisp Suite / HandleVault Official</p>
    </header>

    <main>
        <div class="badge">Special Access Portal</div>
        <p class="description">Welcome to the secure gateway of the Crisp Suite ecosystem. Your device is configured for a seamless, installable PWA experience.</p>
        
        <a href="#" class="btn-access" onclick="alert('Access Portal Ready!')">Enter Portal 🚀</a>
    </main>

    <footer>
        <p>&copy; 2026 Crisp Suite / HandleVault Official. All rights reserved.</p>
    </footer>

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((reg) => console.log('Service Worker registered! Scope:', reg.scope))
            .catch((err) => console.log('Service Worker registration failed:', err));
        });
      }
    </script>

    <!-- Repository Integration Script -->
    <script src="repo.js"></script>
</body>
</html>
