<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="Crisp Suite — 3D Mission Gate interactive execution module.">
<title>Crisp Suite — 3D Mission Gate</title>
<style>
:root{color-scheme:dark;--bg:#090d19;--panel:#121a2d;--line:rgba(190,205,235,.14);--text:#f4f7ff;--muted:#aab5ca;--purple:#a99aff;--mint:#6ce0d0;--gold:#f2c879}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at 12% 0%,rgba(115,94,220,.18),transparent 34rem),radial-gradient(ellipse at 90% 15%,rgba(65,190,180,.1),transparent 30rem),var(--bg);color:var(--text);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;perspective:1200px}

body.light-theme{color-scheme:light;--bg:#f8fafc;--panel:#ffffff;--line:rgba(30,41,59,.14);--text:#1e293b;--muted:#64748b;--purple:#7c3aed;--mint:#0d9488;--gold:#d97706}

.container{width:min(640px,calc(100% - 36px));margin:auto}
.gate-card{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:32px;box-shadow:0 20px 40px rgba(0,0,0,0.3);transform-style:preserve-3d;transition:transform .4s cubic-bezier(.2,.8,.2,1),background .3s,border-color .3s}
.gate-card:hover{transform:translateY(-4px) rotateX(1deg) rotateY(-1deg)}

.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;border-bottom:1px solid var(--line);padding-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:850;letter-spacing:.04em;font-size:.9rem}
.mark{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--mint),var(--purple));color:#101326;font-weight:950}

.controls{display:flex;gap:8px}
.ctl-btn{background:#ffffff08;border:1px solid var(--line);color:var(--text);padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:700;font-size:.8rem;transition:.2s}
.ctl-btn:hover{background:var(--purple);color:white;border-color:var(--purple)}

.stamp{display:inline-block;background:rgba(242,200,121,.12);border:1px dashed var(--gold);color:var(--gold);padding:4px 10px;border-radius:6px;font-size:.72rem;font-weight:850;text-transform:uppercase;letter-spacing:.12em;margin-bottom:14px}

h2{font-size:clamp(1.6rem,3vw,2.2rem);margin:0 0 10px;letter-spacing:-.03em}
p{color:var(--muted);font-size:.98rem;margin:0 0 24px;line-height:1.6}

.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 20px;border-radius:999px;font-weight:800;font-size:.9rem;border:0;background:linear-gradient(110deg,var(--mint),#b9adff);color:#0b1020;text-decoration:none;transition:.2s}
.btn:hover{transform:translateY(-2px);opacity:.95}
</style>
</head>
<body>

<div class="container">
    <div class="gate-card">
        <div class="top-bar">
            <div class="brand"><span class="mark">C</span> CRISP SUITE</div>
            <div class="controls">
                <button class="ctl-btn" id="langToggle" onclick="toggleLanguage()">EN / TL</button>
                <button class="ctl-btn" id="themeToggle" onclick="toggleTheme()">☀️ / 🌙</button>
            </div>
        </div>

        <div class="stamp" id="stampText">Classified Objective • Active</div>
        <h2 id="title">Mission Control &amp; Strategic Execution</h2>
        <p id="desc">Welcome to the 3D Mission Gate. Define your core tactical objectives, track critical project milestones, and execute deliverables with precision framework alignment.</p>
        <a class="btn" href="https://vaultkeeper117.gumroad.com/" target="_blank" rel="noopener" id="ctaBtn">Initialize Mission Portal ↗</a>
    </div>
</div>

<!-- Inline UI Logic & State Controller -->
<script>
    const translations = {
        en: {
            stamp: "Classified Objective • Active",
            title: "Mission Control & Strategic Execution",
            desc: "Welcome to the 3D Mission Gate. Define your core tactical objectives, track critical project milestones, and execute deliverables with precision framework alignment.",
            cta: "Initialize Mission Portal ↗"
        },
        tl: {
            stamp: "Kumpidensyal na Layunin • Aktibo",
            title: "Gabay sa Misyon at Estratehikong Aksyon",
            desc: "Maligayang pagdating sa 3D Mission Gate. Itakda ang iyong mga pangunahing layunin, subaybayan ang mga hakbang ng proyekto, at isagawa ang iyong mga mithiin gamit ang tamang sistema.",
            cta: "Buksan ang Mission Portal ↗"
        }
    };

    let currentLang = 'en';

    function toggleLanguage() {
        currentLang = currentLang === 'en' ? 'tl' : 'en';
        document.getElementById('stampText').innerText = translations[currentLang].stamp;
        document.getElementById('title').innerText = translations[currentLang].title;
        document.getElementById('desc').innerText = translations[currentLang].desc;
        document.getElementById('ctaBtn').innerText = translations[currentLang].cta;
    }

    function toggleTheme() {
        document.body.classList.toggle('light-theme');
    }
</script>

<!-- External Repository Data Script -->
<script src="repo.js"></script>

</body>
</html>
